<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Silage Admin Login</title>
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f2f6f3;
        }
        .container {
            text-align: center;
            background: white;
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
        }
        .logo { max-width: 100px; margin-bottom: 20px; }
        h2 { color: #1a3a2a; margin-bottom: 8px; font-weight: 700; }
        p { color: #4d5f55; margin-bottom: 24px; font-size: 0.95rem; }
        .btn {
            background: #c9a04e;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(201, 160, 78, 0.3);
        }
        .btn:hover { background: #b58a3a; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { margin-top: 16px; font-size: 0.9rem; color: #4d5f55; min-height: 24px; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e0e0e0;
            border-top: 2px solid #c9a04e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <img src="/images/JS Final logo.jpeg" alt="JS Silage Logo" class="logo" />
        <h2>Admin Login</h2>
        <p id="message">Click the button below to log in.</p>
        <button class="btn" id="mainBtn">🔐 Login / Sign Up</button>
        <div class="status" id="status"></div>
    </div>

    <script>
        (function() {
            const netlifyIdentity = window.netlifyIdentity;
            const mainBtn = document.getElementById('mainBtn');
            const messageEl = document.getElementById('message');
            const statusEl = document.getElementById('status');

            // --- Wait for Identity to initialize ---
            netlifyIdentity.on('init', function(user) {
                if (user) {
                    messageEl.textContent = '✅ Logged in as ' + user.email;
                    mainBtn.textContent = '📂 Enter CMS';
                    mainBtn.disabled = false;
                    mainBtn.onclick = function() {
                        // Redirect to the CMS page
                        window.location.href = '/admin/cms.html';
                    };
                    statusEl.textContent = 'Click "Enter CMS" to start editing.';
                } else {
                    messageEl.textContent = 'Click the button to log in.';
                    mainBtn.textContent = '🔐 Login / Sign Up';
                    mainBtn.disabled = false;
                    mainBtn.onclick = function() {
                        netlifyIdentity.open('login');
                    };
                    statusEl.textContent = '';
                }
            });

            netlifyIdentity.on('login', function(user) {
                messageEl.textContent = '✅ Logged in as ' + user.email;
                mainBtn.textContent = '📂 Enter CMS';
                mainBtn.disabled = false;
                mainBtn.onclick = function() {
                    window.location.href = '/admin/cms.html';
                };
                statusEl.textContent = 'Click "Enter CMS" to start editing.';
            });

            netlifyIdentity.on('logout', function() {
                messageEl.textContent = 'Click the button to log in.';
                mainBtn.textContent = '🔐 Login / Sign Up';
                mainBtn.disabled = false;
                mainBtn.onclick = function() {
                    netlifyIdentity.open('login');
                };
                statusEl.textContent = '';
            });

            // Check if user is already logged in
            const user = netlifyIdentity.currentUser();
            if (user) {
                messageEl.textContent = '✅ Logged in as ' + user.email;
                mainBtn.textContent = '📂 Enter CMS';
                mainBtn.disabled = false;
                mainBtn.onclick = function() {
                    window.location.href = '/admin/cms.html';
                };
                statusEl.textContent = 'Click "Enter CMS" to start editing.';
            }

            // If there's a token in the URL, open the popup automatically
            if (window.location.hash.includes('invite_token') || 
                window.location.hash.includes('recovery_token') || 
                window.location.hash.includes('confirmation_token')) {
                setTimeout(function() {
                    netlifyIdentity.open('login');
                }, 500);
            }
        })();
    </script>
</body>
</html>
