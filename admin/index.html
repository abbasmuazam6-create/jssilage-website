<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Silage Admin</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f2f6f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Login Overlay --- */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(242, 246, 243, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #loginOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .login-box {
            text-align: center;
            background: white;
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
        }
        .login-box .logo {
            max-width: 100px;
            margin-bottom: 20px;
        }
        .login-box h2 {
            color: #1a3a2a;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .login-box p {
            color: #4d5f55;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }
        .btn {
            background: #c9a04e;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(201, 160, 78, 0.3);
        }
        .btn:hover {
            background: #b58a3a;
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status-text {
            margin-top: 16px;
            font-size: 0.9rem;
            color: #4d5f55;
            min-height: 24px;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e0e0e0;
            border-top: 2px solid #c9a04e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #cmsContainer {
            width: 100%;
            height: 100vh;
            display: none;
        }
        #cmsContainer.visible {
            display: block;
        }
        /* Hide the default browse button to let Uploadcare handle it */
        .nc-image-widget-browse {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN OVERLAY ===== -->
    <div id="loginOverlay">
        <div class="login-box">
            <img src="/images/JS Final logo.jpeg" alt="JS Silage Logo" class="logo" />
            <h2>Admin Login</h2>
            <p id="loginMessage">Click the button below to log in.</p>
            <button class="btn" id="loginBtn">🔐 Login / Sign Up</button>
            <div class="status-text" id="loginStatus"></div>
        </div>
    </div>

    <!-- ===== CMS CONTAINER ===== -->
    <div id="cmsContainer"></div>

    <!-- ===== DECAP CMS SCRIPT ===== -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js">
    </script>

    <script>
        (function() {
            const netlifyIdentity = window.netlifyIdentity;
            const loginOverlay = document.getElementById('loginOverlay');
            const cmsContainer = document.getElementById('cmsContainer');
            const loginBtn = document.getElementById('loginBtn');
            const loginMessage = document.getElementById('loginMessage');
            const loginStatus = document.getElementById('loginStatus');

            const SETTINGS_HASH = '#/collections/settings/entries/general';

            function showCMSWithDeepLink() {
                loginOverlay.classList.add('hidden');
                cmsContainer.classList.add('visible');

                if (window.CMS && !window.CMS._initialized) {
                    try {
                        // Load the CMS with media library support
                        window.CMS.init({
                            config: {
                                backend: {
                                    name: 'git-gateway',
                                    branch: 'main',
                                    repo: 'abbasmuazam6-create/jssilage-website'
                                },
                                // Media library configuration
                                media_library: {
                                    name: 'uploadcare',
                                    config: {
                                        publicKey: 'demopublickey',
                                        multiple: true,
                                        previewStep: true,
                                        imagesOnly: true,
                                        tabs: 'file url'
                                    }
                                }
                            }
                        });
                        window.CMS._initialized = true;
                    } catch (e) {
                        console.error('CMS init error:', e);
                    }
                }

                const identityWidget = document.querySelector('.netlify-identity-widget');
                if (identityWidget && identityWidget.parentNode) {
                    identityWidget.parentNode.removeChild(identityWidget);
                }

                if (window.location.hash !== SETTINGS_HASH) {
                    window.location.hash = SETTINGS_HASH;
                }
            }

            function showLogin() {
                loginOverlay.classList.remove('hidden');
                cmsContainer.classList.remove('visible');
                loginMessage.textContent = 'Click the button below to log in.';
                loginBtn.textContent = '🔐 Login / Sign Up';
                loginBtn.disabled = false;
                loginBtn.onclick = function() {
                    netlifyIdentity.open('login');
                };
                loginStatus.textContent = '';
            }

            function showLoggedIn(user) {
                loginMessage.textContent = '✅ Logged in as ' + user.email;
                loginBtn.textContent = '📂 Open Settings';
                loginBtn.disabled = false;
                loginBtn.onclick = function() {
                    showCMSWithDeepLink();
                };
                loginStatus.textContent = 'Click "Open Settings" to edit your data.';
            }

            netlifyIdentity.on('init', function(user) {
                if (user) {
                    showLoggedIn(user);
                    if (window.location.hash.includes('collections/settings') ||
                        window.location.hash.includes('auto-enter')) {
                        showCMSWithDeepLink();
                    }
                } else {
                    showLogin();
                }
            });

            netlifyIdentity.on('login', function(user) {
                showLoggedIn(user);
                setTimeout(function() {
                    showCMSWithDeepLink();
                }, 500);
            });

            netlifyIdentity.on('logout', function() {
                showLogin();
            });

            const user = netlifyIdentity.currentUser();
            if (user) {
                showLoggedIn(user);
                if (window.location.hash.includes('collections/settings')) {
                    showCMSWithDeepLink();
                }
            } else {
                showLogin();
            }

            if (window.location.hash.includes('invite_token') ||
                window.location.hash.includes('recovery_token') ||
                window.location.hash.includes('confirmation_token')) {
                setTimeout(function() {
                    netlifyIdentity.open('login');
                }, 500);
            }
        })();
    </script>
</body>
</html>
