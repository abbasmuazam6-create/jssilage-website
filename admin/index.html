<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Silage Admin</title>
    <!-- Load Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        /* Loading screen styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f2f6f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .loader {
            text-align: center;
            background: white;
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            max-width: 400px;
        }
        .logo { max-width: 100px; margin-bottom: 20px; }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #c9a04e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status { margin-top: 16px; color: #4d5f55; font-size: 0.9rem; }
        .btn {
            background: #c9a04e;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            margin-top: 16px;
            transition: all 0.3s ease;
        }
        .btn:hover { background: #b58a3a; transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <img src="/images/JS Final logo.jpeg" alt="JS Silage Logo" class="logo" />
        <div id="message">Initializing...</div>
        <div class="status" id="status"></div>
        <button class="btn hidden" id="actionBtn">Continue</button>
    </div>

    <!-- Load Netlify CMS App (bundles React correctly) -->
    <script src="https://unpkg.com/netlify-cms-app@^2.0.0/dist/netlify-cms-app.js"></script>
    <script>
        (function() {
            const netlifyIdentity = window.netlifyIdentity;
            const messageEl = document.getElementById('message');
            const statusEl = document.getElementById('status');
            const actionBtn = document.getElementById('actionBtn');

            // --- Helper: Show CMS is loading ---
            function showLoading() {
                messageEl.innerHTML = '<span class="spinner"></span> Loading CMS...';
                statusEl.textContent = 'Please wait...';
                actionBtn.classList.add('hidden');
            }

            // --- Helper: Show user is logged in ---
            function showLoggedIn(user) {
                messageEl.textContent = '✅ Logged in as ' + user.email;
                statusEl.textContent = 'CMS is loading...';
                actionBtn.classList.add('hidden');
                // The CMS should auto-init, but if it doesn't, we wait
                setTimeout(function() {
                    if (!window.CMS || !window.CMS._initialized) {
                        statusEl.textContent = 'CMS is taking longer than expected.';
                        actionBtn.textContent = '🔄 Try Again';
                        actionBtn.classList.remove('hidden');
                        actionBtn.onclick = function() {
                            location.reload();
                        };
                    }
                }, 10000);
            }

            // --- Helper: Show logged out ---
            function showLoggedOut() {
                messageEl.textContent = '🔐 Please log in';
                statusEl.textContent = 'Click the button below.';
                actionBtn.textContent = 'Login / Sign Up';
                actionBtn.classList.remove('hidden');
                actionBtn.onclick = function() {
                    netlifyIdentity.open('login');
                };
            }

            // --- Check Identity Status ---
            function checkUser() {
                const user = netlifyIdentity.currentUser();
                if (user) {
                    showLoggedIn(user);
                } else {
                    showLoggedOut();
                }
            }

            // --- Initialize ---
            netlifyIdentity.on('init', checkUser);
            netlifyIdentity.on('login', function(user) {
                showLoggedIn(user);
            });
            netlifyIdentity.on('logout', function() {
                showLoggedOut();
            });

            // Check on load
            checkUser();

            // Auto-open popup if there's a token in the URL
            if (window.location.hash.includes('invite_token') ||
                window.location.hash.includes('recovery_token') ||
                window.location.hash.includes('confirmation_token')) {
                setTimeout(function() {
                    netlifyIdentity.open('login');
                }, 500);
            }

            // --- Monitor CMS loading ---
            let cmsCheckCount = 0;
            const cmsCheckInterval = setInterval(function() {
                cmsCheckCount++;
                if (window.CMS) {
                    // CMS is loaded
                    clearInterval(cmsCheckInterval);
                    statusEl.textContent = 'CMS loaded successfully!';
                    messageEl.innerHTML = '🎉 Ready to edit!';
                    actionBtn.textContent = '📂 Open Dashboard';
                    actionBtn.classList.remove('hidden');
                    actionBtn.onclick = function() {
                        // If CMS is loaded, redirect to the default view
                        window.location.href = '/admin/#/';
                    };
                } else if (cmsCheckCount > 15) {
                    // CMS didn't load after ~15 seconds
                    clearInterval(cmsCheckInterval);
                    statusEl.textContent = 'CMS failed to load. Please check your internet connection.';
                    actionBtn.textContent = '🔄 Retry';
                    actionBtn.classList.remove('hidden');
                    actionBtn.onclick = function() {
                        location.reload();
                    };
                }
            }, 1000);
        })();
    </script>
</body>
</html>
