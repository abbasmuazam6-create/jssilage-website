<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Silage Admin</title>
    <!-- Load Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f2f6f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .loader {
            text-align: center;
            background: white;
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
        }
        .logo { max-width: 100px; margin-bottom: 20px; }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #c9a04e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status { margin-top: 16px; color: #4d5f55; font-size: 0.9rem; min-height: 24px; }
        .btn {
            background: #c9a04e;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            margin-top: 16px;
            transition: all 0.3s ease;
        }
        .btn:hover { background: #b58a3a; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .hidden { display: none !important; }
        .error { color: #b33c3c; }
        .success { color: #2d6a4f; }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <img src="/images/JS Final logo.jpeg" alt="JS Silage Logo" class="logo" />
        <div id="message">Initializing...</div>
        <div class="status" id="status"></div>
        <button class="btn hidden" id="actionBtn">Continue</button>
    </div>

    <!-- Use Decap CMS (stable version) -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
        (function() {
            const netlifyIdentity = window.netlifyIdentity;
            const messageEl = document.getElementById('message');
            const statusEl = document.getElementById('status');
            const actionBtn = document.getElementById('actionBtn');

            // --- Helper: Show loading state ---
            function showLoading() {
                messageEl.innerHTML = '<span class="spinner"></span> Loading CMS...';
                statusEl.textContent = 'Please wait...';
                actionBtn.classList.add('hidden');
                actionBtn.disabled = true;
            }

            // --- Helper: Show logged in state ---
            function showLoggedIn(user) {
                messageEl.textContent = '✅ Logged in as ' + user.email;
                statusEl.textContent = 'CMS is loading...';
                actionBtn.classList.add('hidden');
                actionBtn.disabled = true;
                
                // Try to manually initialize CMS if it doesn't auto-start
                setTimeout(function() {
                    if (window.CMS && !window.CMS._initialized) {
                        try {
                            window.CMS.init({
                                config: {
                                    backend: {
                                        name: 'git-gateway',
                                        branch: 'main',
                                        repo: 'abbasmuazam6-create/jssilage-website'
                                    }
                                }
                            });
                            window.CMS._initialized = true;
                            statusEl.textContent = '✅ CMS initialized!';
                            messageEl.innerHTML = '🎉 Ready to edit!';
                            actionBtn.textContent = '📂 Open Dashboard';
                            actionBtn.classList.remove('hidden');
                            actionBtn.disabled = false;
                            actionBtn.onclick = function() {
                                window.location.href = '/admin/#/';
                            };
                        } catch (e) {
                            console.error('CMS init error:', e);
                            statusEl.innerHTML = '<span class="error">❌ CMS initialization failed. Please refresh.</span>';
                            actionBtn.textContent = '🔄 Retry';
                            actionBtn.classList.remove('hidden');
                            actionBtn.disabled = false;
                            actionBtn.onclick = function() {
                                location.reload();
                            };
                        }
                    }
                }, 3000);
            }

            // --- Helper: Show logged out state ---
            function showLoggedOut() {
                messageEl.textContent = '🔐 Please log in';
                statusEl.textContent = 'Click the button below.';
                actionBtn.textContent = '🔐 Login / Sign Up';
                actionBtn.classList.remove('hidden');
                actionBtn.disabled = false;
                actionBtn.onclick = function() {
                    netlifyIdentity.open('login');
                };
            }

            // --- Check Identity Status ---
            function checkUser() {
                const user = netlifyIdentity.currentUser();
                if (user) {
                    showLoggedIn(user);
                } else {
                    showLoggedOut();
                }
            }

            // --- Initialize Identity ---
            netlifyIdentity.on('init', checkUser);
            netlifyIdentity.on('login', function(user) {
                showLoggedIn(user);
            });
            netlifyIdentity.on('logout', function() {
                showLoggedOut();
            });

            // Check on load
            checkUser();

            // Auto-open popup if there's a token in the URL
            if (window.location.hash.includes('invite_token') ||
                window.location.hash.includes('recovery_token') ||
                window.location.hash.includes('confirmation_token')) {
                setTimeout(function() {
                    netlifyIdentity.open('login');
                }, 500);
            }

            // --- Monitor CMS loading ---
            let cmsCheckCount = 0;
            const cmsCheckInterval = setInterval(function() {
                cmsCheckCount++;
                if (window.CMS) {
                    // CMS is loaded
                    clearInterval(cmsCheckInterval);
                    statusEl.textContent = '✅ CMS loaded successfully!';
                    messageEl.innerHTML = '🎉 Ready to edit!';
                    actionBtn.textContent = '📂 Open Dashboard';
                    actionBtn.classList.remove('hidden');
                    actionBtn.disabled = false;
                    actionBtn.onclick = function() {
                        window.location.href = '/admin/#/';
                    };
                } else if (cmsCheckCount > 20) {
                    // CMS didn't load after ~20 seconds
                    clearInterval(cmsCheckInterval);
                    statusEl.innerHTML = '<span class="error">❌ CMS failed to load. Please check your internet connection and refresh.</span>';
                    actionBtn.textContent = '🔄 Retry';
                    actionBtn.classList.remove('hidden');
                    actionBtn.disabled = false;
                    actionBtn.onclick = function() {
                        location.reload();
                    };
                }
            }, 1000);
        })();
    </script>
</body>
</html>
