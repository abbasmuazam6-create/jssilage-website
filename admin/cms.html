<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Silage CMS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f2f6f3;
            color: #1a3a2a;
            font-size: 1.2rem;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #c9a04e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        Loading CMS...
    </div>

    <!-- Load Decap CMS WITHOUT Identity Widget -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
        // When the CMS is ready, hide the loading message
        window.CMS = window.CMS || {};
        window.CMS.init = function() {
            // The CMS will initialize itself
            document.getElementById('loading').style.display = 'none';
        };

        // Check if the CMS loaded successfully
        console.log('Decap CMS loading...');
    </script>
</body>
</html>
