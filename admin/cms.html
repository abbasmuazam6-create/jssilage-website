<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Silage CMS</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f2f6f3;
            color: #1a3a2a;
            font-size: 1.2rem;
            flex-direction: column;
            gap: 16px;
        }
        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #c9a04e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { color: #b33c3c; }
        .btn {
            background: #c9a04e;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .btn:hover { background: #b58a3a; transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Loading CMS...</div>
        <div id="status" style="font-size:0.85rem;color:#4d5f55;"></div>
        <button class="btn hidden" id="retryBtn">🔄 Retry</button>
        <a href="/admin/" class="btn hidden" id="backBtn" style="background:#6c7a72;">← Back to Login</a>
    </div>

    <!-- Use the official netlify-cms-app package -->
    <script src="https://unpkg.com/netlify-cms-app@^2.0.0/dist/netlify-cms-app.js"></script>
    <script>
        (function() {
            const loadingEl = document.getElementById('loading');
            const statusEl = document.getElementById('status');
            const retryBtn = document.getElementById('retryBtn');
            const backBtn = document.getElementById('backBtn');

            // --- Check if we're logged in via Netlify Identity ---
            // The netlify-cms-app package automatically handles Identity
            // But we need to make sure the Identity widget is loaded

            // If the user is not logged in, redirect back to login
            if (window.netlifyIdentity) {
                const user = window.netlifyIdentity.currentUser();
                if (!user) {
                    statusEl.innerHTML = '<span class="error">Not logged in. Redirecting...</span>';
                    setTimeout(function() {
                        window.location.href = '/admin/';
                    }, 1500);
                    return;
                }
            }

            // --- Load the CMS ---
            statusEl.textContent = 'Initializing CMS...';

            // The netlify-cms-app package automatically looks for a config.yml
            // and handles Git Gateway authentication

            // If CMS fails to load, show retry button
            let loadAttempts = 0;
            const maxAttempts = 20;

            function checkCMS() {
                loadAttempts++;
                if (window.CMS) {
                    statusEl.textContent = '✅ CMS loaded successfully!';
                    loadingEl.innerHTML = `
                        <div style="text-align:center;">
                            <div style="font-size:3rem;margin-bottom:16px;">🎉</div>
                            <div style="font-size:1.2rem;color:#1a3a2a;font-weight:600;">CMS is ready!</div>
                            <div style="font-size:0.9rem;color:#4d5f55;margin-top:8px;">The dashboard should appear shortly.</div>
                        </div>
                    `;
                    return true;
                }

                if (loadAttempts >= maxAttempts) {
                    statusEl.innerHTML = '<span class="error">CMS failed to load after multiple attempts.</span>';
                    retryBtn.classList.remove('hidden');
                    backBtn.classList.remove('hidden');
                    return false;
                }

                setTimeout(checkCMS, 500);
                return false;
            }

            // Wait for CMS to load
            setTimeout(checkCMS, 1000);

            // Retry button
            retryBtn.onclick = function() {
                loadAttempts = 0;
                statusEl.textContent = 'Retrying...';
                retryBtn.classList.add('hidden');
                backBtn.classList.add('hidden');
                // Reload the page to try again
                location.reload();
            };

            // If the user is already logged in but CMS doesn't load, we can try to
            // re-initialize the Identity widget to trigger authentication
            if (window.netlifyIdentity) {
                window.netlifyIdentity.on('login', function() {
                    // Reload the page when login happens
                    location.reload();
                });
            }
        })();
    </script>
</body>
</html>
