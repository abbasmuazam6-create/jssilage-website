<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Silage CMS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f2f6f3;
            color: #1a3a2a;
            font-size: 1.2rem;
            flex-direction: column;
            gap: 16px;
        }
        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #c9a04e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error { color: #b33c3c; }
        .btn {
            background: #c9a04e;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .btn:hover { background: #b58a3a; transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Loading CMS...</div>
        <div id="status" style="font-size:0.85rem;color:#4d5f55;"></div>
        <button class="btn hidden" id="retryBtn">🔄 Retry</button>
        <a href="/admin/" class="btn hidden" id="backBtn" style="background:#6c7a72;">← Back to Login</a>
    </div>

    <!-- Use Decap CMS v2.10.2 (stable version) -->
    <script src="https://unpkg.com/decap-cms@2.10.2/dist/decap-cms.js"></script>
    <script>
        (function() {
            const statusEl = document.getElementById('status');
            const retryBtn = document.getElementById('retryBtn');
            const backBtn = document.getElementById('backBtn');

            function initCMS() {
                try {
                    if (window.CMS) {
                        window.CMS.init({
                            config: {
                                backend: {
                                    name: 'git-gateway',
                                    branch: 'main',
                                    repo: 'abbasmuazam6-create/jssilage-website'
                                }
                            }
                        });
                        statusEl.textContent = '✅ CMS initialized successfully!';
                        document.querySelector('.loading').innerHTML = `
                            <div style="text-align:center;">
                                <div style="font-size:3rem;margin-bottom:16px;">🎉</div>
                                <div style="font-size:1.2rem;color:#1a3a2a;font-weight:600;">CMS is ready!</div>
                                <div style="font-size:0.9rem;color:#4d5f55;margin-top:8px;">The dashboard should appear shortly.</div>
                            </div>
                        `;
                        return true;
                    }
                    return false;
                } catch (e) {
                    console.error('CMS init error:', e);
                    statusEl.innerHTML = '<span class="error">❌ CMS initialization failed: ' + e.message + '</span>';
                    return false;
                }
            }

            let attempts = 0;
            const maxAttempts = 20;

            function waitForCMS() {
                attempts++;
                if (initCMS()) {
                    return;
                }

                if (attempts >= maxAttempts) {
                    statusEl.innerHTML = '<span class="error">❌ CMS failed to load after multiple attempts.</span>';
                    retryBtn.classList.remove('hidden');
                    backBtn.classList.remove('hidden');
                    retryBtn.onclick = function() {
                        location.reload();
                    };
                    return;
                }

                setTimeout(waitForCMS, 500);
            }

            waitForCMS();

            setTimeout(function() {
                if (attempts < maxAttempts && !window.CMS) {
                    if (window.netlifyIdentity) {
                        const user = window.netlifyIdentity.currentUser();
                        if (!user) {
                            statusEl.innerHTML = '<span class="error">Not authenticated. Redirecting to login...</span>';
                            setTimeout(function() {
                                window.location.href = '/admin/';
                            }, 1500);
                        }
                    }
                }
            }, 3000);
        })();
    </script>
</body>
</html>
