backend:
  name: git-gateway
  branch: main
  repo: abbasmuazam6-create/jssilage-website

# Media folder where images are stored
media_folder: "images"
public_folder: "/images"

# Media library configuration
media_library:
  name: uploadcare
  config:
    publicKey: "demopublickey"
    multiple: true
    previewStep: true
    imagesOnly: true
    crop: "16:9"
    tabs: "file url"

collections:
  - name: "settings"
    label: "Website Settings"
    files:
      - name: "general"
        label: "General Data"
        file: "data/data.json"
        fields:
          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Company Name", name: "name", widget: "string" }
              - { label: "Tagline (Footer)", name: "tagline", widget: "text" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "WhatsApp (numbers only, no +)", name: "whatsapp", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }

          - label: "Locations"
            name: "locations"
            widget: "list"
            fields:
              - { label: "City", name: "city", widget: "string" }
              - { label: "Is Main Factory?", name: "is_main", widget: "boolean", default: false }
              - { label: "Contact Person", name: "contact", widget: "string", required: false }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "WhatsApp", name: "whatsapp", widget: "string", required: false }
              - { label: "Address", name: "address", widget: "string" }
              - { 
                  label: "Location Image", 
                  name: "image", 
                  widget: "image", 
                  required: false,
                  media_library: {
                    config: {
                      multiple: false,
                      previewStep: true,
                      crop: "4:3"
                    }
                  }
                }

          - label: "Price List"
            name: "prices"
            widget: "list"
            fields:
              - { label: "Product Name", name: "name", widget: "string" }
              - { label: "Unit", name: "unit", widget: "string" }
              - { label: "Price (PKR)", name: "price", widget: "string" }
              - { label: "Badge", name: "badge", widget: "string", required: false }
              - { label: "Is Wanda Product?", name: "is_wanda", widget: "boolean", default: false }

          - label: "News & Updates"
            name: "news"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date (e.g., Aug 10)", name: "date", widget: "string" }
              - { label: "Content", name: "content", widget: "text" }
              - { label: "Tag", name: "tag", widget: "string" }
              - { 
                  label: "News Image", 
                  name: "image", 
                  widget: "image", 
                  required: false,
                  media_library: {
                    config: {
                      multiple: false,
                      previewStep: true,
                      crop: "16:9"
                    }
                  }
                }